<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ping Pong - HTML Only</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      font-family: system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    canvas {
      background: #0d0f1a;
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
      border-radius: 12px;
      image-rendering: pixelated; /* crisp */
      max-width: min(95vw, 900px);
      max-height: 90vh;
    }
    .footer {
      position: fixed;
      bottom: 8px;
      font-size: 12px;
      opacity: .5;
    }
  </style>
</head>
<body>
  <canvas id="game" width="900" height="600"></canvas>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      /** @type {CanvasRenderingContext2D} */
      const ctx = canvas.getContext('2d');

      // World size
      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;

      // Game params
      const BALL_RADIUS = 8;
      const PADDLE_W = 12;
      const PADDLE_H = 100;
      const PADDING = 20;

      const BASE_BALL_SPEED = 380;   // px/s
      const MAX_BALL_SPEED = 900;
      const MIN_BALL_SPEED = 240;
      const SPEEDUP_FACTOR = 1.03;

      // Players and AI
      const LEFT_KEYS = { up: 'KeyW', down: 'KeyS' };
      const RIGHT_KEYS = { up: 'ArrowUp', down: 'ArrowDown' };

      let aiLeft = true;
      let aiRight = false; // Change to true for 2-player mode with AI on right too

      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
      function rand(min, max) { return Math.random() * (max - min) + min; }

      const left = {
        x: PADDING,
        y: HEIGHT/2 - PADDLE_H/2,
        w: PADDLE_W,
        h: PADDLE_H,
        speed: 500, // px/s
        score: 0,
      };

      const right = {
        x: WIDTH - PADDING - PADDLE_W,
        y: HEIGHT/2 - PADDLE_H/2,
        w: PADDLE_W,
        h: PADDLE_H,
        speed: 500,
        score: 0,
      };

      const ball = {
        x: WIDTH/2, y: HEIGHT/2,
        vx: 0, vy: 0,
        r: BALL_RADIUS,
        speed: BASE_BALL_SPEED
      };

      let paused = false;
      let serveCooldown = 0; // seconds

      const keys = {};
      window.addEventListener('keydown', e => { keys[e.code] = true; });
      window.addEventListener('keyup', e => { keys[e.code] = false; });

      canvas.addEventListener('pointermove', (e) => {
        // Move right paddle with mouse/touch
        const rect = canvas.getBoundingClientRect();
        const scaleX = WIDTH / rect.width;
      }, true);

      function resetBall(direction = 0) {
        ball.x = WIDTH/2;
        ball.y = HEIGHT/2;
        let angle = rand(-0.3, 0.3); // radians
        if (direction === 0) direction = Math.random() < 0.5 ? -1 : 1;
        const spd = BASE_BALL_SPEED;
        ball.vx = Math.cos(angle) * spd * direction;
        ball.vy = Math.sin(angle) * spd;
      }

      function startRound(scoredBy) {
        // scoredBy: 'left' or 'right'
        if (scoredBy === 'left') left.score++;
        else right.score++;

        serveCooldown = 0.8; // seconds
        resetBall(0);
      }

      function updatePaddle(p, targetY, dt) {
        const speed = p.speed;
        let vy = 0;
        if (aiLeft) {
          // Simple AI: follow ball when it's close to left side or moving toward left paddle
          const nearRightSide = ball.x > WIDTH * 0.6;
          const target = aiLeft && (nearRightSide || ball.vx < 0) ? ball.y : HEIGHT/2 - PADDLE_H/2 + p.h/2;
          if (p === left) {
            vy += clamp(target - p.y, -speed * dt, speed * dt);
          }
        } else {
          // Human control via keys
          if (p === left) {
            if (keys[LEFT_KEYS.up]) vy -= speed;
            if (keys[LEFT_KEYS.down]) vy += speed;
          }
        }

        p.y = clamp(p.y + vy * dt, 0, HEIGHT - p.h);
      }

      function updateAIRight(dt) {
        // Simple right-side AI
        const targetY = ball.vx > 0 ? ball.y : HEIGHT/2; // anticipate when ball goes left
        const dy = clamp(targetY - (right.y + right.h/2), -right.speed * dt, right.speed * dt);
        right.y = clamp(right.y + dy, 0, HEIGHT - right.h);
      }

      function updateBall(dt) {
        if (serveCooldown > 0) return;

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // Walls
        if (ball.y - BALL_RADIUS < 0 && ball.vy < 0) { ball.vy *= -1; }
        if (ball.y + BALL_RADIUS > HEIGHT && ball.vy > 0) { ball.vy *= -1; }

        // Top/bottom bounce
        const speed = Math.hypot(ball.vx, ball.vy);
        if (speed < MIN_BALL_SPEED) {
          const s = clamp(speed, MIN_BALL_SPEED, MAX_BALL_SPEED);
          const nx = ball.vx / speed;
          const ny = ball.vy / speed;
          ball.vx = nx * s;
          ball.vy = ny * s;
        }
      }

      function collidePaddle(p) {
        // Circle-rect collision
        return (
          ball.x + BALL_RADIUS > p.x &&
          ball.x - BALL_RADIUS < p.x + p.w &&
          ball.y + BALL_RADIUS > p.y &&
          ball.y - BALL_RADIUS < p.y + p.h
        );
      }

      function hitLeft() {
        if (collidePaddle(left)) {
          // Place ball just outside paddle to prevent sticking
          ball.x = left.x + left.w + BALL_RADIUS;
          let offset = (ball.y - (left.y + left.h/2));
          const maxAngle = 0.75; // ~43 degrees
          const angle = clamp(offset / (PADDLE_H/2) * maxAngle, -maxAngle, maxAngle);
          const spd = Math.min(MAX_BALL_SPEED, Math.max(MIN_BALL_SPEED, ball.speed * SPEEDUP_FACTOR));
          ball.vx = Math.abs(spd); // to the right
          ball.vy = Math.sin(angle) * spd;
        }
      }

      function hitRight() {
        if (collidePaddle(right)) {
          // Place ball just outside paddle to prevent sticking
          ball.x = right.x - BALL_RADIUS;
          let offset = (ball.y - (right.y + right.h/2));
          const maxAngle = 0.75; // ~43 degrees
          const angle = clamp(offset / (PADDLE_H/2) * maxAngle, -maxAngle, maxAngle);
          const spd = Math.min(MAX_BALL_SPEED, Math.max(MIN_BALL_SPEED, ball.speed * SPEEDUP_FACTOR));
          ball.vx = -Math.abs(spd); // to the left
          ball.vy = Math.sin(angle) * spd;
        }
      }

      function checkScore() {
        if (ball.x < 0) { startRound('right'); }
        else if (ball.x > WIDTH) { startRound('left'); }
      }

      // Rendering helpers
      function drawNet() {
        ctx.strokeStyle = '#2a2d45';
        const dashH = 12, gap = 10;
        for (let x = 0; x < HEIGHT; x += dashH + gap) {
          ctx.beginPath();
          ctx.moveTo(WIDTH/2, x);
          ctx.lineTo(WIDTH/2, x + dashH);
          ctx.stroke();
        }
      }

      function drawCourt() {
        ctx.fillStyle = '#0b1021';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // Center line
        drawNet();

        // Paddles
        ctx.fillStyle = '#f2f2f2';
        ctx.fillRect(left.x, left.y, left.w, left.h);
        ctx.fillRect(right.x, right.y, right.w, right.h);

        // Ball
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI*2);
        ctx.closePath();
        ctx.fillStyle = '#f8e45c';
        ctx.fill();

        // Scoreboard
        ctx.font = 'bold 28px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        const scoreText = `${left.score}   ${right.score}`;
        ctx.fillText(scoreText, WIDTH/2, 40);
      }

      function drawOverlay() {
        if (serveCooldown > 0) {
          ctx.save();
          ctx.globalAlpha = 1;
          ctx.font = '16px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = '#ffffffaa';
          const text = `Get Ready...`;
          ctx.fillText(text, WIDTH/2, HEIGHT - 40);
          ctx.restore();
        }
      }

      // Main loop
      let lastTime = performance.now();

      function frame(now) {
        const dtRaw = (now - lastTime) / 1000;
        lastTime = now;

        if (!paused) {
          // Update paddles
          updatePaddle(left, null, dtRaw);
          if (aiRight) updateAIRight(dtRaw);

          // Update ball physics and collisions
          updateBall(dtRaw);

          // Paddle collisions
          hitLeft();
          hitRight();

          // Score check after bounces
          checkScore();

          // Serve cooldown timer
          serveCooldown = Math.max(0, serveCooldown - dtRaw);
        }

        // Draw
        drawCourt();
        drawOverlay();

        requestAnimationFrame(frame);
      }

      function togglePause() { paused = !paused; }
      document.addEventListener('keydown', e => {
        if (e.code === 'KeyP') togglePause();
      });

      // Start first round with no cooldown
      resetBall(0);

      requestAnimationFrame((t) => {
        lastTime = t;
        frame(t);
      });
    })();
  </script>
</body>
</html>
